; ESP32-S3-N16R8 + ST7789 1.69" 240x280 + KY-040 encoder + buzzer + touch
;
; Kode hardware bersama di src/core/, app Desk Buddy di src/desk_buddy/:
;   pio run -e desk-buddy -t upload
; Monitor: pio device monitor

[platformio]
default_envs = desk-buddy
; App lain di hardware yang sama (opsional): file terpisah *.app.ini
extra_configs = *.app.ini

; Setting hardware bersama; env app & tes meng-extend ini
[board]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16MB flash (QIO) + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial lewat port USB-C native (yang kebaca sebagai /dev/cu.usbmodem*)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; app include "board.h", "input.h", dst. dari core; secrets.h di src/
    -Isrc
    -Isrc/core

    ; ---- TFT_eSPI config (pengganti User_Setup.h) ----
    ; Pin display ada di sini karena TFT_eSPI butuh build flag. Pin lain di src/config.h.
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=280
    -DTFT_RGB_ORDER=TFT_BGR   ; panel ini BGR (dengan RGB, merah tampil biru)
    -DTFT_MOSI=13   ; SDA
    -DTFT_SCLK=14   ; SCL
    -DTFT_CS=10
    -DTFT_DC=11
    -DTFT_RST=12
    ; Wajib di S3: FSPI default bikin crash (StoreProhibited) di tft.init().
    ; Efek samping: log "spiAttachMISO(): HSPI Does not have default pins" saat boot — aman, MISO tidak dipakai.
    -DUSE_HSPI_PORT=1
    ; 20 MHz: aman lewat kabel jumper + breadboard (40 MHz bisa gagal, layar cuma abu-abu)
    -DSPI_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1

[env:desk-buddy]
extends = board
build_src_filter = +<core/> +<desk_buddy/>

; Build untuk dibagikan (web installer): tanpa secrets.h, WiFi diisi lewat hotspot setup.
;   pio run -e desk-buddy-release && tools/make-release.sh
[env:desk-buddy-release]
extends = env:desk-buddy
build_flags =
    ${board.build_flags}
    -DNO_SECRETS

; Tes display terpisah (Adafruit ST7789), untuk debug wiring:
;   pio run -e lcdtest -t upload
[env:lcdtest]
extends = board
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.11
build_src_filter = -<*> +<../test_lcd/>

; Tes kabel: GPIO 9-14 kedip bareng (lihat test_pins/pintest.cpp)
;   pio run -e pintest -t upload
[env:pintest]
extends = board
lib_deps =
build_src_filter = -<*> +<../test_pins/>

; Tes buzzer: active (HIGH) lalu passive (nada 1 kHz), berulang
;   pio run -e buzzertest -t upload
[env:buzzertest]
extends = board
lib_deps =
build_src_filter = -<*> +<../test_buzzer/>
