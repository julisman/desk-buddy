; ESP32-S3-N16R8 + ST7789 1.69" 240x280 + KY-040 encoder + buzzer + touch
;
; Shared hardware code in src/core/, Desk Buddy app in src/desk_buddy/:
;   pio run -e desk-buddy -t upload
; Monitor: pio device monitor

[platformio]
default_envs = desk-buddy
; Other apps on the same hardware (optional): separate *.app.ini files
extra_configs = *.app.ini

; Shared hardware settings; app & test envs extend this
[board]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16MB flash (QIO) + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial over the native USB-C port (shows up as /dev/cu.usbmodem*)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; apps include "board.h", "input.h", etc. from core; secrets.h is in src/
    -Isrc
    -Isrc/core

    ; ---- TFT_eSPI config (replaces User_Setup.h) ----
    ; Display pins live here because TFT_eSPI needs build flags. Other pins are in src/config.h.
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=280
    -DTFT_RGB_ORDER=TFT_BGR   ; this panel is BGR (with RGB, red shows as blue)
    -DTFT_MOSI=13   ; SDA
    -DTFT_SCLK=14   ; SCL
    -DTFT_CS=10
    -DTFT_DC=11
    -DTFT_RST=12
    ; Required on S3: default FSPI crashes (StoreProhibited) in tft.init().
    ; Side effect: "spiAttachMISO(): HSPI Does not have default pins" logged at boot — harmless, MISO isn't used.
    -DUSE_HSPI_PORT=1
    ; 20 MHz: safe over jumper wires + breadboard (40 MHz can fail, screen stays gray)
    -DSPI_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1

[env:desk-buddy]
extends = board
build_src_filter = +<core/> +<desk_buddy/>

; Build for sharing (web installer): no secrets.h, WiFi is set via the setup hotspot.
;   pio run -e desk-buddy-release && tools/make-release.sh
[env:desk-buddy-release]
extends = env:desk-buddy
build_flags =
    ${board.build_flags}
    -DNO_SECRETS

; Standalone display test (Adafruit ST7789), for debugging wiring:
;   pio run -e lcdtest -t upload
[env:lcdtest]
extends = board
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.11
build_src_filter = -<*> +<../test_lcd/>

; Wiring test: GPIO 9-14 blink together (see test_pins/pintest.cpp)
;   pio run -e pintest -t upload
[env:pintest]
extends = board
lib_deps =
build_src_filter = -<*> +<../test_pins/>

; Buzzer test: active (HIGH) then passive (1 kHz tone), repeating
;   pio run -e buzzertest -t upload
[env:buzzertest]
extends = board
lib_deps =
build_src_filter = -<*> +<../test_buzzer/>
